name: Collect GEX History

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ZeroGEX and update history.json
        run: |
          python3 << 'PY'
          import json, urllib.request, time, re
          from pathlib import Path

          ZEROGEX = "https://zerogex.io/mcp"
          HISTORY = Path("history.json")
          MAX_DAYS = 5

          def fetch_zerogex():
              req = urllib.request.Request(
                  ZEROGEX,
                  data=json.dumps({
                      "jsonrpc": "2.0",
                      "id": 1,
                      "method": "tools/call",
                      "params": {"name": "get_gamma_levels", "arguments": {"symbol": "ES"}}
                  }).encode(),
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read())
              text = data.get("result", {}).get("content", [{}])[0].get("text", "")
              return text

          def parse(text):
              def get(label):
                  m = re.search(label + r":\s*([\d,.]+)", text, re.I)
                  return float(m.group(1).replace(",", "")) if m else None
              regime = re.search(r"Modeled regime:\s*(\w+)", text, re.I)
              net = re.search(r"Net dealer gamma at spot:\s*([\u2212\-\$0-9.,]+[BM])", text, re.I)
              return {
                  "spot": get("Spot the levels were computed against"),
                  "flip": get("Gamma flip"),
                  "callWall": get("Call wall"),
                  "putWall": get("Put wall"),
                  "regime": regime.group(1).lower() if regime else "unknown",
                  "netGex": net.group(1) if net else None,
              }

          def parse_net(raw):
              if not raw: return None
              num = float(re.sub(r"[\u2212\-$,]", "", raw).replace("B", "e9").replace("M", "e6"))
              return -num if ("\u2212" in raw or "-" in raw) else num

          def compute_scores(zg, hist):
              spot = zg.get("spot")
              flip = zg.get("flip")
              callWall = zg.get("callWall")
              putWall = zg.get("putWall")
              regime = zg.get("regime") or "unknown"
              net = parse_net(zg.get("netGex"))
              if not spot or not flip:
                  return {"long": 0, "short": 0, "straddle": 0, "bias": "Insufficient data"}
              flip_dist_pct = abs(spot - flip) / spot * 100
              near_flip = flip_dist_pct < 0.4
              regime_long = regime in ("long", "positive")
              regime_short = regime in ("short", "negative")
              spot_above = spot > flip
              near_put = putWall and abs(spot - putWall) < 60
              near_call = callWall and abs(spot - callWall) < 60
              slope_up = slope_down = False
              if hist and len(hist) >= 3:
                  recent = [e.get("netGex") for e in hist[-3:] if e.get("netGex") is not None]
                  if len(recent) >= 2:
                      delta = recent[-1] - recent[0]
                      slope_up = delta > 0
                      slope_down = delta < 0
              long_s = 0
              if regime_long and spot_above: long_s += 40
              if near_put: long_s += 20
              if slope_up or (not slope_down and hist): long_s += 15
              if not near_flip: long_s += 10
              long_s = max(0, min(100, long_s))
              short_s = 0
              if regime_short and not spot_above: short_s += 40
              if near_call: short_s += 20
              if slope_down: short_s += 15
              if not near_flip: short_s += 10
              short_s = max(0, min(100, short_s))
              straddle_s = 0
              if near_flip: straddle_s += 50
              if net and abs(net) > 1e9: straddle_s += 25
              if near_flip or regime not in ("long", "short"): straddle_s += 15
              straddle_s = max(0, min(100, straddle_s))
              total = long_s + short_s + straddle_s or 1
              long_n = round((long_s / total) * 100)
              short_n = round((short_s / total) * 100)
              straddle_n = round((straddle_s / total) * 100)
              bias = "Neutral"
              if long_n > short_n and long_n > straddle_n and long_n >= 40: bias = "Long bias"
              elif short_n > long_n and short_n > straddle_n and short_n >= 40: bias = "Short bias"
              elif straddle_n >= 40: bias = "Straddle / expansion bias"
              return {"long": long_n, "short": short_n, "straddle": straddle_n, "bias": bias}

          try:
              text = fetch_zerogex()
              zg = parse(text)
              hist = []
              if HISTORY.exists():
                  hist = json.loads(HISTORY.read_text() or "[]")
              scores = compute_scores(zg, hist)
              entry = {
                  "ts": int(time.time() * 1000),
                  "spot": zg["spot"],
                  "flip": zg["flip"],
                  "callWall": zg["callWall"],
                  "putWall": zg["putWall"],
                  "netGex": parse_net(zg["netGex"]),
                  "regime": zg["regime"],
                  "long": scores["long"],
                  "short": scores["short"],
                  "straddle": scores["straddle"],
                  "bias": scores["bias"],
              }
              hist.append(entry)
              cutoff = entry["ts"] - MAX_DAYS * 86400000
              hist = [e for e in hist if e.get("ts", 0) >= cutoff]
              by15 = {}
              for e in hist:
                  key = e["ts"] // (15 * 60 * 1000)
                  by15[key] = e
              hist = sorted(by15.values(), key=lambda x: x["ts"])
              if len(hist) > 500:
                  hist = hist[-500:]
              HISTORY.write_text(json.dumps(hist, indent=2))
              print(f"Updated history with {len(hist)} points. Latest long={entry['long']} short={entry['short']} straddle={entry['straddle']}")
          except Exception as e:
              print(f"Error: {e}")
              raise
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "Update GEX history $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
